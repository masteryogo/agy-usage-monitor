[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-usage-monitor"
version = "0.1.0"
description = "Real-time usage dashboard for Antigravity CLI (agy) in the terminal status line."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/masteryogo/agy-usage-monitor"
Repository = "https://github.com/masteryogo/agy-usage-monitor"

[project.scripts]
agy-usage-monitor = "agy_usage_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["agy_usage_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
